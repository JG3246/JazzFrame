# ONE-OFF cleanup: two legacy submissions (uploaded before the track-merge era)
# contain their own audio and have no track chosen, so their downloads play an
# unintended soundtrack. This replaces each stored file with a silent H.264 MP4
# (matching the other early uploads), keeps a backup of the original in
# videos/backups/, points the submission row at the new file, and removes the
# old object. Idempotent: if the original file is already gone, it skips.
# Delete this workflow file once both replacements are verified.
name: Cleanup legacy submission audio

on:
  push:
    paths:
      - '.github/workflows/cleanup-legacy-audio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE: https://qqxlgygacojaugerzgiq.supabase.co
      # Public anon key (same one embedded in the site's pages); the videos
      # bucket policies allow insert/delete and submissions allow update.
      KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFxeGxneWdhY29qYXVnZXJ6Z2lxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNjExMDYsImV4cCI6MjA5MzYzNzEwNn0.AMBwsXrnTL02FY0T7Da6pJfKGVU3_AfA0Ce851CTog4
    steps:
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Replace audio-bearing legacy videos with silent normalised copies
        run: |
          set -euo pipefail
          auth=(-H "apikey: $KEY" -H "Authorization: Bearer $KEY")

          process () {
            local name="$1" row_id="$2" mode="$3"   # mode: reencode | copy
            local src="$BASE/storage/v1/object/public/videos/session_014/${name}.mp4"
            local base_new="session_014/${name}_silent.mp4"

            status=$(curl -s -o /dev/null -w '%{http_code}' -r 0-0 "$src")
            if [ "$status" != "200" ] && [ "$status" != "206" ]; then
              echo "SKIP $name — original not found (HTTP $status), already cleaned"
              return 0
            fi

            echo "Downloading $name"
            curl -sfo original.mp4 "$src"

            echo "Backing up original to videos/backups/${name}.mp4"
            curl -sf -X POST "${auth[@]}" -H 'Content-Type: video/mp4' -H 'x-upsert: true' \
              --data-binary @original.mp4 "$BASE/storage/v1/object/videos/backups/${name}.mp4" > /dev/null

            echo "Creating silent version ($mode)"
            if [ "$mode" = "copy" ]; then
              ffmpeg -y -hide_banner -loglevel warning -i original.mp4 -an -c:v copy -movflags +faststart silent.mp4
            else
              ffmpeg -y -hide_banner -loglevel warning -i original.mp4 -an \
                -vf 'scale=ceil(iw/2)*2:ceil(ih/2)*2,format=yuv420p' \
                -c:v libx264 -preset veryfast -crf 20 -movflags +faststart silent.mp4
            fi

            echo "Uploading replacement"
            curl -sf -X POST "${auth[@]}" -H 'Content-Type: video/mp4' -H 'x-upsert: true' \
              --data-binary @silent.mp4 "$BASE/storage/v1/object/videos/${base_new}" > /dev/null

            echo "Pointing submission row at replacement"
            curl -sf -X PATCH "${auth[@]}" -H 'Content-Type: application/json' -H 'Prefer: return=minimal' \
              -d "{\"video_url\":\"$BASE/storage/v1/object/public/videos/${base_new}\"}" \
              "$BASE/rest/v1/submissions?id=eq.${row_id}"

            echo "Deleting original object"
            curl -sf -X DELETE "${auth[@]}" "$BASE/storage/v1/object/videos/session_014/${name}.mp4" > /dev/null
            echo "DONE $name"
          }

          # Nixtakaur "River Wye" — HEVC + AAC, needs re-encode to H.264
          process "1783342602066_dw1ds36t3e4" "3cb9073c-952d-40c0-82c9-2d99a735492a" "reencode"
          # Admin test upload (Aug 26) — already H.264, just strip audio
          process "1787742302899_d43ma93se15" "c5ea3ab9-44b8-4433-a70e-55cea1335931" "copy"
