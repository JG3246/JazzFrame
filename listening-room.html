<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>The Listening Room — JazzEra</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ --ink:#14171C; --ink-2:#1B2027; --parchment:#EDE7D9; --parchment-dim:#9A937F; --brass:#C9A227; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--ink); color:var(--parchment); font-family:'Work Sans', sans-serif; }
  .wrap{ max-width:560px; margin:0 auto; padding:28px 16px 120px; }
  .masthead{ text-align:center; margin-bottom:8px; }
  .masthead svg{ width:170px; height:auto; }
  .room-title{ font-family:'Fraunces', serif; font-weight:600; font-size:24px; text-align:center; margin:14px 0 4px; }
  .room-sub{ font-family:'Fraunces', serif; font-style:italic; font-size:14px; color:var(--parchment-dim); text-align:center; margin:0 0 26px; line-height:1.5; }
  .track{
    display:flex; align-items:center; gap:12px;
    padding:11px 12px; border-bottom:1px solid rgba(237,231,217,0.08);
    cursor:pointer; border-radius:2px;
  }
  .track:active{ background:rgba(201,162,39,0.08); }
  .track.playing{ background:var(--ink-2); border-left:2px solid var(--brass); }
  .track-num{ font-size:12px; color:var(--parchment-dim); width:24px; text-align:right; flex:0 0 24px; }
  .track-name{ flex:1; min-width:0; font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .track.playing .track-name{ color:var(--brass); }
  .track-dur{ font-size:12px; color:var(--parchment-dim); }
  .player-bar{
    position:fixed; left:0; right:0; bottom:0;
    background:var(--ink-2); border-top:1px solid rgba(201,162,39,0.3);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  }
  .player-inner{ max-width:560px; margin:0 auto; display:flex; align-items:center; gap:12px; }
  .pb-btn{
    background:transparent; border:1px solid var(--brass); color:var(--brass);
    width:42px; height:42px; border-radius:50%; font-size:15px; cursor:pointer; flex:0 0 42px;
  }
  .pb-meta{ flex:1; min-width:0; }
  .pb-name{ font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pb-progress{ height:3px; background:rgba(237,231,217,0.12); margin-top:7px; border-radius:2px; overflow:hidden; cursor:pointer; }
  .pb-progress-fill{ height:100%; width:0%; background:var(--brass); }
  .pb-skip{ background:none; border:none; color:var(--parchment-dim); font-size:17px; cursor:pointer; padding:6px; }

  /* ── Invite gate ── */
  body.locked .wrap, body.locked .player-bar{ display:none; }
  .lr-gate{
    display:none; position:fixed; inset:0; z-index:50; background:var(--ink);
    align-items:center; justify-content:center; padding:24px 16px;
  }
  body.locked .lr-gate{ display:flex; }
  .lr-gate-card{
    width:100%; max-width:400px; background:var(--ink-2);
    border:1px solid rgba(201,162,39,0.3); border-radius:4px;
    padding:30px 24px; text-align:center;
  }
  .lr-gate-title{ font-family:'Fraunces', serif; font-weight:600; font-size:22px; margin:0 0 6px; }
  .lr-gate-sub{ font-family:'Fraunces', serif; font-style:italic; font-size:13.5px; color:var(--parchment-dim); margin:0 0 22px; line-height:1.5; }
  .lr-gate-label{ display:block; text-align:left; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--parchment-dim); margin:0 0 6px; }
  .lr-gate-input{
    width:100%; padding:11px 12px; border-radius:2px;
    background:var(--ink); border:1px solid rgba(237,231,217,0.2);
    color:var(--parchment); font-family:'Work Sans', sans-serif; font-size:14.5px;
  }
  .lr-gate-input:focus{ outline:none; border-color:var(--brass); }
  .lr-gate-btn{
    width:100%; margin-top:14px; padding:12px;
    background:transparent; border:1px solid var(--brass); color:var(--brass);
    border-radius:2px; font-family:'Work Sans', sans-serif; font-weight:600;
    font-size:14px; letter-spacing:0.04em; cursor:pointer;
  }
  .lr-gate-btn:active{ background:rgba(201,162,39,0.12); }
  .lr-gate-error{ font-size:13px; color:#D08770; margin:12px 0 0; min-height:18px; line-height:1.5; }
  .lr-gate-status{ font-size:13.5px; color:var(--parchment-dim); margin:0; }
</style>
</head>
<body class="locked">

<!-- ══ INVITE GATE ══ -->
<div class="lr-gate" id="lrGate">
  <div class="lr-gate-card">
    <h1 class="lr-gate-title">The Listening Room</h1>
    <p class="lr-gate-sub">This room is open to invited listeners only.</p>
    <div id="lrGateChecking"><p class="lr-gate-status">Checking your invitation&hellip;</p></div>
    <div id="lrGateForm" style="display:none;">
      <label class="lr-gate-label" for="lrEmail">Invited email address</label>
      <input class="lr-gate-input" id="lrEmail" type="email" placeholder="you@example.com" autocomplete="email">
      <button class="lr-gate-btn" onclick="lrGateSubmit()">Enter the Room</button>
      <div class="lr-gate-error" id="lrGateError"></div>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="masthead">
    <svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg" aria-label="JazzEra">
      <g transform="translate(150,8)">
        <line x1="-56" y1="96" x2="56" y2="96" stroke="#3C4A4A" stroke-width="4" stroke-linecap="round"/>
        <polygon points="14,64 52,42 48,55 18,74" fill="#2E3B3B"/>
        <ellipse cx="0" cy="68" rx="27" ry="23" fill="#3C4A4A"/>
        <path d="M-18 72 q17 20 36 3 q-4 17 -20 17 q-15 0 -16 -20 Z" fill="#EDE7D9" opacity="0.85"/>
        <path d="M-4 56 q24 -3 28 15 q-16 11 -31 2 q-3 -10 3 -17 Z" fill="#2E3B3B"/>
        <path d="M4 62 q11 0 15 8" stroke="#C9A227" stroke-width="1.6" fill="none" opacity="0.6"/>
        <path d="M-7 89 l0 7 M8 89 l0 7" stroke="#C9A227" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="-17" cy="40" r="17" fill="#46606B"/>
        <path d="M-30 44 q5 10 17 11 q-1 -9 -5 -13 q-7 -3 -12 2 Z" fill="#14171C"/>
        <path d="M-21 24 q3 -5 8 -4 M-16 23 q4 -4 8 -2" stroke="#C9A227" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.85"/>
        <circle cx="-20" cy="37" r="4" fill="#EDE7D9"/>
        <circle cx="-20.5" cy="37.5" r="2.2" fill="#14171C"/>
        <polygon points="-33,40 -48,43 -33,46" fill="#C9A227"/>
      </g>
      <text x="150" y="152" text-anchor="middle" font-size="34" font-family="Fraunces, Georgia, serif" font-weight="600" letter-spacing="1" fill="#C9A227">JazzEra</text>
      <line x1="92" y1="170" x2="208" y2="170" stroke="#C9A227" stroke-width="1" opacity="0.5"/>
    </svg>
  </div>
  <h1 class="room-title">The Listening Room</h1>
  <p class="room-sub">Jazz in Ordinary Time — the catalogue so far, one track a week.</p>
  <div id="trackList"></div>
</div>

<div class="player-bar">
  <div class="player-inner">
    <button class="pb-btn" id="pbPlay">&#9654;&#xFE0E;</button>
    <div class="pb-meta">
      <div class="pb-name" id="pbName">Choose a track</div>
      <div class="pb-progress" id="pbProgress"><div class="pb-progress-fill" id="pbFill"></div></div>
    </div>
    <button class="pb-skip" id="pbNext" aria-label="Next track">&#9197;&#xFE0E;</button>
  </div>
</div>

<script>
// ══ INVITE GATE ══
// Access is controlled by the listening_room_invites table in Supabase —
// a separate list from the homepage's invites table.
const SUPABASE_URL = 'https://qqxlgygacojaugerzgiq.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFxeGxneWdhY29qYXVnZXJ6Z2lxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNjExMDYsImV4cCI6MjA5MzYzNzEwNn0.AMBwsXrnTL02FY0T7Da6pJfKGVU3_AfA0Ce851CTog4';
const sbLR = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function lrShowForm(message){
  document.getElementById('lrGateChecking').style.display = 'none';
  document.getElementById('lrGateForm').style.display = 'block';
  document.getElementById('lrGateError').textContent = message || '';
}

function lrUnlock(email){
  sessionStorage.setItem('lr_user', JSON.stringify({ email: email }));
  document.body.classList.remove('locked');
}

// Returns 'ok' if the email is on the Listening Room list,
// 'denied' if not, 'error' if the check couldn't be completed.
async function lrCheckEmail(email){
  try {
    const { data, error } = await sbLR
      .from('listening_room_invites')
      .select('id')
      .ilike('email', email)
      .maybeSingle();
    if (error) return 'error';
    return data ? 'ok' : 'denied';
  } catch(e) {
    return 'error';
  }
}

async function lrGateSubmit(){
  const email = document.getElementById('lrEmail').value.trim().toLowerCase();
  const errEl = document.getElementById('lrGateError');
  errEl.textContent = '';
  if (!email){ errEl.textContent = 'Please enter your email address.'; return; }

  const result = await lrCheckEmail(email);
  if (result === 'ok'){ lrUnlock(email); return; }
  if (result === 'denied'){
    errEl.textContent = 'Sorry — this email isn\'t on the invite list for the Listening Room.';
  } else {
    errEl.textContent = 'We couldn\'t verify your invitation just now. Please try again in a moment.';
  }
}

// On load: restore a previous entry for this browser session, re-verifying
// the email is still on the list; otherwise show the email form.
(function(){
  let stored = null;
  try { stored = JSON.parse(sessionStorage.getItem('lr_user')); } catch(e) {}
  if (!stored || !stored.email){ lrShowForm(); return; }
  lrCheckEmail(stored.email).then(function(result){
    if (result === 'ok'){ lrUnlock(stored.email); }
    else {
      sessionStorage.removeItem('lr_user');
      lrShowForm(result === 'denied' ? 'Your invitation is no longer on the list.' : '');
    }
  });
})();

document.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && document.body.classList.contains('locked')) lrGateSubmit();
});

/* TRACKS-START — Claude Code: replace this array with one entry per file found in the /tracks folder, in filename order. name = filename without extension, tidied (hyphens/underscores to spaces). */
var TRACKS = [
  { name: 'Track 00', src: 'tracks/Jazz in Ordinary Time 00.mp3' },
  { name: 'Track 01', src: 'tracks/Jazz in Ordinary time 01.mp3' },
  { name: 'Track 02', src: 'tracks/Jazz in Ordinary time 02.mp3' },
  { name: 'Track 03', src: 'tracks/Jazz in Ordinary time 03.mp3' },

  { name: 'Track 51', src: 'tracks/Jazz in Ordinary Time 51.mp3' },
  { name: 'Track 52', src: 'tracks/Jazz in Ordinary Time 52.mp3' }
];
/* TRACKS-END */

(function(){
  var audio = new Audio();
  audio.preload = 'none';
  var current = -1;
  var list = document.getElementById('trackList');
  var pbPlay = document.getElementById('pbPlay');
  var pbName = document.getElementById('pbName');
  var pbFill = document.getElementById('pbFill');
  var pbProgress = document.getElementById('pbProgress');
  var rows = [];

  TRACKS.forEach(function(t, i){
    var row = document.createElement('div');
    row.className = 'track';
    row.innerHTML = '<span class="track-num">' + (i + 1) + '</span>' +
                    '<span class="track-name"></span>' +
                    '<span class="track-dur"></span>';
    row.querySelector('.track-name').textContent = t.name;
    row.addEventListener('click', function(){ play(i); });
    list.appendChild(row);
    rows.push(row);
  });

  function play(i){
    if (i === current){ toggle(); return; }
    current = i;
    audio.src = TRACKS[i].src;
    audio.play();
    pbName.textContent = TRACKS[i].name;
    rows.forEach(function(r, j){ r.classList.toggle('playing', j === i); });
    pbPlay.innerHTML = '&#10074;&#10074;';
  }

  function toggle(){
    if (current < 0){ if (TRACKS.length) play(0); return; }
    if (audio.paused){ audio.play(); pbPlay.innerHTML = '&#10074;&#10074;'; }
    else { audio.pause(); pbPlay.innerHTML = '&#9654;&#xFE0E;'; }
  }

  pbPlay.addEventListener('click', toggle);
  document.getElementById('pbNext').addEventListener('click', function(){
    if (TRACKS.length) play((current + 1) % TRACKS.length);
  });

  audio.addEventListener('timeupdate', function(){
    if (audio.duration) pbFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
  });
  audio.addEventListener('ended', function(){
    if (current < TRACKS.length - 1) play(current + 1);
    else { pbPlay.innerHTML = '&#9654;&#xFE0E;'; rows[current].classList.remove('playing'); current = -1; pbName.textContent = 'Choose a track'; }
  });
  pbProgress.addEventListener('click', function(e){
    if (!audio.duration) return;
    var rect = pbProgress.getBoundingClientRect();
    audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
  });
})();
</script>
</body>
</html>
